name: PRScout Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate pr.json Event Payload
        run: |
          cat << 'EOF' > pr.json
          {
            "repository": {
              "full_name": "${{ github.repository }}"
            },
            "pull_request": {
              "number": ${{ github.event.pull_request.number }}
            }
          }
          EOF
          
          echo "Generated pr.json contents:"
          cat pr.json

      - name: Run PRScout Docker Container
        env:
          PRSCOUT_GITHUB_TOKEN: ${{ secrets.PRSCOUT_GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ secrets.GROQ_FALLBACK_MODEL }}
        run: |
          if [ -z "$PRSCOUT_GITHUB_TOKEN" ]; then
            echo "::error::PRSCOUT_GITHUB_TOKEN is unavailable. Add it to the repository running this workflow; secrets are not passed to pull_request workflows from forks."
            exit 1
          fi

          docker run --rm \
            -v $(pwd):/workspace \
            --env PRSCOUT_GITHUB_TOKEN \
            --env GROQ_API_KEY \
            --env GROQ_MODEL \
            --env GROQ_FALLBACK_MODEL \
            asmb3456/prscout:latest --event /workspace/pr.json
